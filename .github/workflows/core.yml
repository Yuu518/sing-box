name: Build Cores

on:
  workflow_dispatch:
  push:

jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.go.outputs.version}}
    steps:
      - name: get latest go version
        id: go
        run: |
          echo version=$(curl -s https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | grep -oE '"version": "[0-9]{1}.[0-9]{1,}(.[0-9]{1,})?"' | head -1 | cut -d':' -f2 | sed 's/ //g; s/"//g') >> $GITHUB_OUTPUT

  sing-box:
    runs-on: ubuntu-latest
    needs: go
    outputs:
      version: ${{steps.sing-box.outputs.version}}
      release: ${{ steps.sing-box.outputs.release }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: get sing-box version
        id: sing-box
        run: |
          version=$(git describe --tags --abbrev=0)
          echo version=$version >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs:
      - go
      - sing-box
    strategy:
      matrix:
        jobs:
          # android
          - { goos: android, goarch: arm64, ndk: aarch64-linux-android35, output: arm64-v8a }
          - { goos: android, goarch: arm, goarm: 7, ndk: armv7a-linux-androideabi35, output: armeabi-v7a }
          
          # linux
          - { goos: linux, goarch: amd64, goamd64: v1, output: amd64 }
          - { goos: linux, goarch: arm64, output: arm64 }

          # windows
          - { goos: windows, goarch: amd64, goamd64: v1, output: amd64 }
    env:
      GOOS: ${{ matrix.jobs.goos }}
      GOARM: ${{ matrix.jobs.goarm }}
      GOARCH: ${{ matrix.jobs.goarch }}
      GOAMD64: ${{ matrix.jobs.goamd64 }}
      GOMIPS: ${{ matrix.jobs.gomips }}
      CGO_ENABLED: ${{ (matrix.jobs.goos == 'android' || matrix.jobs.goos == 'linux') && 1 || 0 }}
      VERSION: ${{ needs.sing-box.outputs.version }}
      RELEASE: ${{ needs.sing-box.outputs.release }}
      SUFFIX: ${{ matrix.jobs.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: ${{needs.go.outputs.version}}

      - name: Setup NDK
        if: ${{ matrix.jobs.goos == 'android' }}
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Setup CC ENV
        if: ${{ matrix.jobs.goos == 'android' }}
        run: echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.jobs.ndk }}-clang" >> $GITHUB_ENV

      - name: Prepare Cronet
        if: ${{ matrix.jobs.goos == 'linux' || matrix.jobs.goos == 'windows' }}
        run: |
          git clone --recursive --depth=1 https://github.com/sagernet/cronet-go.git
          cd cronet-go
          
          TARGET="${{ matrix.jobs.goos }}/${{ matrix.jobs.goarch }}"
        
          if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
            GOOS=linux GOARCH=amd64 go run ./cmd/build-naive --target=$TARGET extract-lib
            mv *.dll ../
        
          elif [ "${{ matrix.jobs.goos }}" == "linux" ]; then
            GOOS=linux GOARCH=amd64 go run ./cmd/build-naive --target=$TARGET --libc=musl download-toolchain
            GOOS=linux GOARCH=amd64 go run ./cmd/build-naive --target=$TARGET --libc=musl env >> $GITHUB_ENV
          fi

      - name: Set build tags
        run: |
          BASE_TAGS="with_quic,with_dhcp,with_wireguard,with_tailscale,with_utls,with_acme,with_clash_api,with_gvisor,with_cloudflared"
          
          if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
            TAGS="${BASE_TAGS},with_purego,with_naive_outbound"
          elif [ "${{ matrix.jobs.goos }}" == "linux" ]; then
            TAGS="${BASE_TAGS},with_musl,with_naive_outbound,with_ebpf"
          else
            TAGS="${BASE_TAGS},with_naive_outbound,with_ebpf"
          fi
          
          echo "BUILD_TAGS=${TAGS}" >> $GITHUB_ENV

      - name: generate eBPF object
        if: ${{ contains(env.BUILD_TAGS, 'with_ebpf') }}
        env:
          BPF_CLANG: clang
        run: make ebpf_generate

      - name: build core
        run: go build -o sing-box${{ env.SUFFIX }} -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" -tags "${BUILD_TAGS}" ./cmd/sing-box

      - name: upload core to actions
        uses: actions/upload-artifact@v6.0.0
        with:
          name: sing-box-${{ env.VERSION }}-${{ env.GOOS }}-${{ matrix.jobs.output }}
          path: |
            sing-box${{ env.SUFFIX }}
            *.dll
          compression-level: 6

      - name: Create archive
        run: |
          mkdir -p dist
          if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
            zip -j dist/sing-box-${{ env.VERSION }}-${{ env.GOOS }}-${{ matrix.jobs.output }}.zip sing-box${{ env.SUFFIX }} *.dll 2>/dev/null || zip -j dist/sing-box-${{ env.VERSION }}-${{ env.GOOS }}-${{ matrix.jobs.output }}.zip sing-box${{ env.SUFFIX }}
          else
            tar -czf dist/sing-box-${{ env.VERSION }}-${{ env.GOOS }}-${{ matrix.jobs.output }}.tar.gz sing-box${{ env.SUFFIX }}
          fi

      - name: Set build time
        run: echo "DATE=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE }}
          tag_name: ${{ env.VERSION }}
          body: |
            Build time: ${{ env.DATE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*
          prerelease: true
