name: Build Cores

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sing-box.outputs.version }}
      go-version: ${{ steps.setup-go.outputs.go-version }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: setup go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Get sing-box version
        id: sing-box
        run: |
          version=$(CGO_ENABLED=0 go run ./cmd/internal/read_tag)
          echo version=$version >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        jobs:
          # android
          - { goos: android, goarch: arm64, ndk: aarch64-linux-android35, output: arm64-v8a }
          - { goos: android, goarch: arm, goarm: 7, ndk: armv7a-linux-androideabi35, output: armeabi-v7a }

          # linux
          - { goos: linux, goarch: amd64, goamd64: v1, output: amd64 }
          - { goos: linux, goarch: arm64, output: arm64 }

          # windows
          - { goos: windows, goarch: amd64, goamd64: v1, output: amd64 }
    env:
      GOOS: ${{ matrix.jobs.goos }}
      GOARM: ${{ matrix.jobs.goarm }}
      GOARCH: ${{ matrix.jobs.goarch }}
      GOAMD64: ${{ matrix.jobs.goamd64 }}
      GOMIPS: ${{ matrix.jobs.gomips }}
      CGO_ENABLED: ${{ (matrix.jobs.goos == 'android' || matrix.jobs.goos == 'linux') && 1 || 0 }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SUFFIX: ${{ matrix.jobs.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v6.0.1

      - name: setup go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ needs.prepare.outputs.go-version }}
          cache: false

      - name: Setup NDK
        if: ${{ matrix.jobs.goos == 'android' }}
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk
        with:
          ndk-version: r29
          local-cache: true

      - name: Setup CC ENV
        if: ${{ matrix.jobs.goos == 'android' }}
        run: echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.jobs.ndk }}-clang" >> $GITHUB_ENV

      - name: Prepare Cronet
        if: ${{ matrix.jobs.goos == 'linux' || matrix.jobs.goos == 'windows' }}
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)

          if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
            LIBRARY_PATH="lib/windows_${{ matrix.jobs.goarch }}/libcronet.dll"
            git init "$RUNNER_TEMP/cronet-go-lib"
            git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
            git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
            git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
            git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
            cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" .

          else
            git init ~/cronet-go
            git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
            git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
            git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
            git -C ~/cronet-go checkout FETCH_HEAD
            git -C ~/cronet-go submodule update --init --recursive --depth=1
            cd ~/cronet-go

            rm -f naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
            GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go run ./cmd/build-naive --target=linux/${{ matrix.jobs.goarch }} --libc=musl env >> $GITHUB_ENV
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go run ./cmd/build-naive --target=linux/${{ matrix.jobs.goarch }} --libc=musl download-toolchain
          fi

      - name: Set build tags
        run: |
          BASE_TAGS="with_quic,with_dhcp,with_wireguard,with_tailscale,with_utls,with_acme,with_clash_api,with_gvisor,with_cloudflared"

          if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
            TAGS="${BASE_TAGS},with_purego,with_naive_outbound"
          elif [ "${{ matrix.jobs.goos }}" == "linux" ]; then
            TAGS="${BASE_TAGS},with_musl,with_naive_outbound,with_ebpf"
          else
            TAGS="${BASE_TAGS},with_naive_outbound,with_ebpf"
          fi

          echo "BUILD_TAGS=${TAGS}" >> $GITHUB_ENV

      - name: build core
        run: make build TAGS="${BUILD_TAGS}" VERSION="${VERSION}"

      - name: upload core to actions
        uses: actions/upload-artifact@v6.0.0
        with:
          name: sing-box-${{ env.VERSION }}-${{ env.GOOS }}-${{ matrix.jobs.output }}
          path: |
            sing-box${{ env.SUFFIX }}
            libcronet.dll
          compression-level: 6

      - name: Create archive
        run: |
          set -xeuo pipefail
          mkdir -p dist
          ARCHIVE="sing-box-${VERSION}-${GOOS}-${{ matrix.jobs.output }}"
          if [ "${{ matrix.jobs.goos }}" == "windows" ]; then
            zip -j "dist/${ARCHIVE}.zip" sing-box${{ env.SUFFIX }} libcronet.dll
          else
            tar -czf "dist/${ARCHIVE}.tar.gz" sing-box
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v6.0.0
        with:
          name: dist-${{ env.GOOS }}-${{ matrix.jobs.output }}
          path: dist/*
          compression-level: 0
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: download archives
        uses: actions/download-artifact@v6.0.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Set build time
        run: echo "DATE=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            Build time: ${{ env.DATE }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*
          prerelease: true
