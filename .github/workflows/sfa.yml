name: Build SFA

on:
  workflow_dispatch:
  push:

jobs:
  go:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.go.outputs.version}}
    steps:
      - name: get latest go version
        id: go
        run: |
          echo version=$(curl -s https://raw.githubusercontent.com/actions/go-versions/update-versions-manifest-file/versions-manifest.json | grep -oE '"version": "[0-9]{1}.[0-9]{1,}(.[0-9]{1,})?"' | head -1 | cut -d':' -f2 | sed 's/ //g; s/"//g') >> $GITHUB_OUTPUT

  sing-box:
    runs-on: ubuntu-latest
    needs: go
    outputs:
      version: ${{steps.sing-box.outputs.version}}
      release: ${{ steps.sing-box.outputs.release }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: get sing-box version
        id: sing-box
        run: |
          version=$(git describe --tags --abbrev=0)
          echo version=$version >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs:
      - go
      - sing-box
    env:
      VERSION: ${{ needs.sing-box.outputs.version }}
      GO-VERSION: ${{needs.go.outputs.version}}
      RELEASE: ${{ needs.sing-box.outputs.release }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: ${{needs.go.outputs.version}}

      - name: checkout app repository
        uses: actions/checkout@v6.0.1
        with:
          path: sfa
          repository: SagerNet/sing-box-for-android
          ref: 'dev'
          submodules: recursive

      - name: setup ndk
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        run: |-
          sudo apt update && sudo apt install -y openjdk-17-jdk-headless
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java --version

      - name: get latest build tools version
        id: sdk
        run: echo version=$(ls $ANDROID_HOME/build-tools | tail -n 1) >> $GITHUB_OUTPUT

      - name: build libbox
        env:
          ANDROID_NDK_HOME: ${{steps.setup-ndk.outputs.ndk-path}}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          TAGS: with_quic,with_dhcp,with_wireguard,with_tailscale,with_utls,with_clash_api,with_gvisor,with_cloudflared,with_naive_outbound,with_ebpf
        run: |
          make lib_install
          BPF_CLANG=clang make ebpf_generate
          gomobile bind -v -a -trimpath -buildvcs=false -androidapi 23 -javapkg=io.nekohasekai -libname=box -tags ${TAGS} -ldflags "-checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${VERSION} -s -w -buildid=" ./experimental/libbox

      - name: setup build env && build app
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          mkdir -p sfa/app/libs/
          cp ./libbox.aar sfa/app/libs/
          echo "${{ secrets.SIGN_KEY }}" | base64 -d > sfa/app/release.keystore
          cd sfa
          sed -i 's/-Xmx8192m/-Xmx8192m -XX:+UseParallelGC/' gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          cat > version.properties << EOF
          VERSION_NAME=${VERSION}
          VERSION_CODE=$(date +%Y%m%d%H)
          GO_VERSION=${GO-VERSION}
          EOF
          chmod +x ./gradlew
          ./gradlew :app:clean :app:assembleOtherRelease && ./gradlew --stop

      - name: upload arm64-v8a apk
        uses: actions/upload-artifact@v6.0.0
        with:
          name: sfa-${{env.VERSION}}-arm64-v8a
          path: sfa/app/build/outputs/apk/other/release/*-arm64-v8a.apk
          compression-level: 6

      - name: upload armeabi-v7a apk
        uses: actions/upload-artifact@v6.0.0
        with:
          name: sfa-${{env.VERSION}}-armeabi-v7a
          path: sfa/app/build/outputs/apk/other/release/*-armeabi-v7a.apk
          compression-level: 6

      - name: upload x86_64 apk
        uses: actions/upload-artifact@v6.0.0
        with:
          name: sfa-${{env.VERSION}}-x86_64
          path: sfa/app/build/outputs/apk/other/release/*-x86_64.apk
          compression-level: 6

      - name: upload x86 apk
        uses: actions/upload-artifact@v6.0.0
        with:
          name: sfa-${{env.VERSION}}-x86
          path: sfa/app/build/outputs/apk/other/release/*-x86.apk
          compression-level: 6

      - name: upload universal apk
        uses: actions/upload-artifact@v6.0.0
        with:
          name: sfa-${{env.VERSION}}-universal
          path: sfa/app/build/outputs/apk/other/release/*-universal.apk
          compression-level: 6

      - name: Generate version metadata
        run: |
          echo "{\"version_code\": $(cat sfa/version.properties | grep VERSION_CODE | cut -d'=' -f2), \"version_name\": \"${VERSION}\"}" > SFA-version-metadata.json

      - name: Set build time
        run: echo "DATE=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_ENV"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE }}
          tag_name: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Build time: ${{ env.DATE }}
          files: |
            sfa/app/build/outputs/apk/other/release/*.apk
            SFA-version-metadata.json
          prerelease: true