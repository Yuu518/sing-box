name: Delete old workflow runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: delete-workflow-runs
  cancel-in-progress: false

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2.0.6
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 1
